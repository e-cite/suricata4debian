---
name: First Test workflow
on:
  - push
  - workflow_dispatch
jobs:
  build:
    strategy:
      fail-fast: false  # Do not cancel other matrix jobs when one job fails
      matrix:
        major_version: ["7", "8"]
        distro: [bookworm, trixie]
        arch: [amd64, arm64]
        variant: ["stable", "ruleprofiling", "unittests"]
        exclude:
          # daily nur für 8, nicht für 7
          - major_version: "7"
            variant: "daily"

    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container:
      image: debian:${{ matrix.distro }}

    steps:
      - run: |
          echo "suricata${{ matrix.major_version }}-${{ matrix.variant }}
          for ${{ matrix.distro }} on ${{ matrix.arch }}"
      - run: cat /etc/debian_version
