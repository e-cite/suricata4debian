---
name: First Test workflow
on:
  - push
  - workflow_dispatch
env:
  UPSTREAM_VERSION: "8.0.5"
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - run: echo "UPSTREAM_VERSION=$UPSTREAM_VERSION"
      - name: Download Suricata upstream tarball for given UPSTREAM_VERSION
        run: curl -O "https://www.openinfosecfoundation.org/download/suricata-$UPSTREAM_VERSION.tar.gz"
      - name: Calculate SHA256 hash of download file
        run: sha256sum "suricata-$UPSTREAM_VERSION.tar.gz"
      # TODO: Verify download
      - run: ls -l
      - name: Upload upstream tarball as artifact
        uses: actions/upload-artifact@v7
        with:
          name: suricata-upstream
          path: "suricata-*.tar.gz"
          retention-days: 1
  build:
    needs: download
    strategy:
      fail-fast: false  # Do not cancel other matrix jobs when one job fails
      matrix:
        # major_version: ["7", "8"]
        variant: [stable]
        distro: [trixie]
        arch: [amd64]
        #exclude:
        #  # daily nur für 8, nicht für 7
        #  - major_version: "7"
        #    variant: "daily"
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container:
      image: debian:${{ matrix.distro }}
    steps:
      - run: echo "$UPSTREAM_VERSION"
      - run: |
          echo "suricata${{ matrix.major_version }}-${{ matrix.variant }} \
          for ${{ matrix.distro }} on ${{ matrix.arch }}"
      - run: cat /etc/debian_version
      - name: Download upstream tarball as artifact
        uses: actions/download-artifact@v8
        with:
          name: suricata-upstream
      - run: ls -la
      - run: tar -xvzf "suricata-$UPSTREAM_VERSION.tar.gz"
      - run: ls -la
